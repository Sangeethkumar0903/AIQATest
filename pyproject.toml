[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiqatest"
version = "1.0.0"
description = "Reusable quality engineering framework for API and AI systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4,<4.12",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-html>=4.1,<5",
    "ruff>=0.8,<1",
]
ui = ["playwright>=1.48,<2"]
llm = ["deepeval>=2.0,<4"]
all = [
    "pytest>=8.3,<9",
    "pytest-html>=4.1,<5",
    "ruff>=0.8,<1",
    "playwright>=1.48,<2",
    "deepeval>=2.0,<4",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "evaluators*", "sample_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
