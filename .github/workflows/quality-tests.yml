name: AIQATest quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check .

      - name: Run offline quality suite
        run: >-
          python -m pytest -m "not llm and not ui"
          --html=reports/quality-report.html --self-contained-html
          --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiqatest-reports
          path: reports/
          if-no-files-found: error
